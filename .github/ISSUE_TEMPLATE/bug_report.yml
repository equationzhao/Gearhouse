name: Bug report
description: Report a reproducible problem in Gearhouse.
body:
  - type: input
    id: version
    attributes:
      label: App and iOS version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic equipment names and activities where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove API Keys, personal activity data, account details, and device identifiers.
