name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check repository and generated files
        run: python3 scripts/check-repository.py
      - name: Test core rules
        run: swift test
      - name: Compile iPhone app
        run: |
          xcodebuild -project GearhouseApp.xcodeproj -scheme GearhouseApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO build
